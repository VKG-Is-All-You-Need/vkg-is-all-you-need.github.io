# 资源数据。字段定义见 src/content.config.ts，构建时会按 schema 校验。
# category 取值：standards | tools | tutorials | benchmarks | papers | adjacent
# 条目在页面中的顺序与本文件一致。
# 以 _en 结尾的字段为英文版文字：summary_en 必填，有 note 时须同时填写 note_en；
# 名称本身为英文时可省略 title_en 与 label_en。

# ── 标准规范 ────────────────────────────────────────────────

- id: r2rml
  category: standards
  title: R2RML
  url: https://www.w3.org/TR/r2rml/
  summary: W3C 推荐标准，定义关系数据库到 RDF 的映射语言。规范不限定执行方式，同时适用于虚拟访问与物化。
  summary_en: W3C Recommendation that defines a language for mapping relational databases to RDF. The specification does not prescribe how mappings are executed and applies to both virtual access and materialization.

- id: direct-mapping
  category: standards
  title: Direct Mapping
  url: https://www.w3.org/TR/rdb-direct-mapping/
  summary: W3C 推荐标准，依据表、列与主外键约束自动生成 RDF。适合用于理解映射机制；生成的词汇沿用表名与列名，仍需与领域本体对齐。
  summary_en: W3C Recommendation that generates RDF automatically from tables, columns and primary and foreign key constraints. Useful for understanding how mappings work; the generated vocabulary reuses table and column names and still has to be aligned with a domain ontology.

- id: owl2-ql
  category: standards
  title: OWL 2 QL
  url: https://www.w3.org/TR/owl2-profiles/#OWL_2_QL
  summary: OWL 2 的一个 profile，专为查询改写设计，使查询能够以 SQL 在关系数据库上求值。OBDA 本体建模通常以其表达能力为界，超出范围的 OWL 2 推理一般不受支持。
  summary_en: An OWL 2 profile designed for query rewriting, so that queries can be evaluated as SQL over relational databases. Ontologies for OBDA are usually modeled within its expressivity; OWL 2 reasoning beyond this profile is generally not supported.

- id: sparql-11
  category: standards
  title: SPARQL 1.1
  url: https://www.w3.org/TR/sparql11-query/
  summary: W3C 推荐的 RDF 查询语言。各引擎支持的特性范围以其兼容性文档为准。
  summary_en: The W3C-recommended query language for RDF. The features supported by each engine are listed in its compliance documentation.

- id: rdb2rdf-test-cases
  category: standards
  title: RDB2RDF Test Cases
  url: https://www.w3.org/TR/rdb2rdf-test-cases/
  summary: R2RML 与 Direct Mapping 的官方测试集，包含输入数据库、映射与期望的 RDF 输出。用于符合性与回归测试，不用于性能评测。
  summary_en: The official test suite for R2RML and Direct Mapping, with input databases, mappings and expected RDF output. Intended for conformance and regression testing, not for performance evaluation.

# ── 工具 ────────────────────────────────────────────────────

- id: ontop
  category: tools
  title: Ontop
  url: https://github.com/ontop/ontop
  summary: 开源 VKG 引擎，本站收录的多数工具与教程均基于 Ontop。代码与问题跟踪见 GitHub，部署与配置见官方文档。
  summary_en: Open-source VKG engine on which most tools and tutorials listed here are based. Source code and issue tracking are on GitHub; deployment and configuration are covered in the official documentation.
  links:
    - label: 官方文档
      label_en: Documentation
      url: https://ontop-vkg.org/guide/

- id: ontop-getting-started
  category: tools
  title: Ontop · Getting Started
  url: https://ontop-vkg.org/guide/getting-started.html
  summary: Ontop 入门指南，介绍 Docker、命令行与 Protégé 插件三种使用方式。新项目建议部署为 HTTP SPARQL endpoint。
  summary_en: 'The Ontop getting-started guide, covering three ways of running Ontop: Docker, the command line and the Protégé plugin. New projects are advised to deploy an HTTP SPARQL endpoint.'

- id: ontop-cli
  category: tools
  title: Ontop CLI
  url: https://ontop-vkg.org/guide/cli.html
  summary: Ontop 命令行工具，用于启动 endpoint、执行查询、bootstrap 本体与映射，以及处理映射文件。
  summary_en: The Ontop command-line tool for starting an endpoint, running queries, bootstrapping an ontology and mappings, and processing mapping files.
  note: bootstrap 生成的本体与映射仅为初稿，业务语义需人工审核。
  note_en: The ontology and mappings produced by bootstrap are only a first draft; their domain semantics require manual review.

- id: protege-mapping-manager
  category: tools
  title: Protégé Mapping Manager
  url: https://ontop-vkg.org/tutorial/basic/university-1.html
  summary: 在 Protégé 中结合本体编写和管理映射。
  summary_en: Writes and manages mappings together with the ontology in Protégé.
  note: 旧版 Mapping Assistant 面板已移除，早期教程中的界面说明不再适用。
  note_en: The former Mapping Assistant panel has been removed; interface descriptions in older tutorials no longer apply.

- id: ontop-lenses
  category: tools
  title: Ontop Lenses
  url: https://ontop-vkg.org/guide/advanced/lenses.html
  summary: 在 Ontop 层定义关系视图，用于整理复杂的源表结构，或适配无法修改的数据库。
  summary_en: Defines relational views at the Ontop level, used to reorganize complex source schemas or to adapt databases that cannot be modified.
  note: Protégé 插件暂不支持 lenses。
  note_en: The Protégé plugin does not yet support lenses.

- id: ontop-compliance
  category: tools
  title: Ontop 标准兼容性
  title_en: Ontop standards compliance
  url: https://ontop-vkg.org/guide/compliance.html
  summary: 说明 Ontop 对 SPARQL、R2RML、GeoSPARQL 等标准的支持范围。
  summary_en: Describes the extent to which Ontop supports SPARQL, R2RML, GeoSPARQL and other standards.

- id: ontopic-repos
  category: tools
  title: Ontopic 公开仓库
  title_en: Ontopic public repositories
  url: https://github.com/ontopic-vkg
  summary: Ontopic 发布的行业映射、教程与部署示例。
  summary_en: Industry mappings, tutorials and deployment examples published by Ontopic.
  note: 各仓库许可证不同，使用前请逐一确认。
  note_en: Licenses differ between repositories; check each one before use.

# ── 教程与案例 ──────────────────────────────────────────────

- id: ontop-tutorial
  category: tutorials
  title: Ontop 官方教程
  title_en: Ontop tutorial
  url: https://ontop-vkg.org/tutorial/
  summary: 以大学数据库为例，涵盖映射、endpoint 部署、查询及进阶主题。推荐作为入门教程。
  summary_en: Uses a university database to cover mappings, endpoint deployment, queries and advanced topics. Recommended as the introductory tutorial.
  note: 配套文件仓库为文档示例的镜像，文档源码位于 ontop-website 仓库。
  note_en: The companion files repository mirrors the examples in the documentation; the documentation source is in the ontop-website repository.
  links:
    - label: 配套文件
      label_en: Companion files
      url: https://github.com/ontop/ontop-tutorial
    - label: ontop-website
      url: https://github.com/ontop/ontop-website

- id: mapping-engineering
  category: tutorials
  title: Mapping Engineering
  url: https://ontop-vkg.org/tutorial/mapping/
  summary: 映射工程专题，涵盖主键、外键与 IRI 模板。关注语义正确性与生成 SQL 的性能，而不仅是语法有效。
  summary_en: A tutorial series on mapping engineering, covering primary keys, foreign keys and IRI templates. It focuses on semantic correctness and the performance of the generated SQL, not only on syntactic validity.

- id: destination-tutorial
  category: tutorials
  title: DEST / Destination
  url: https://github.com/ontopic-vkg/destination-tutorial
  summary: 基于南蒂罗尔旅游住宿数据，提供数据库、本体、映射练习、SPARQL 查询与参考答案。
  summary_en: Based on tourism accommodation data from South Tyrol, with a database, an ontology, mapping exercises, SPARQL queries and reference solutions.
  note: 部分说明基于 Ontop 4.1.0 等历史版本。
  note_en: Parts of the instructions refer to historical versions such as Ontop 4.1.0.

- id: bgee-mapping-patterns
  category: tutorials
  title: Bgee / Mapping Patterns
  url: https://github.com/ontop/ontop-patterns-tutorial
  summary: 基于 Bgee 基因表达数据，提供数据库 dump、本体、OBDA 与 R2RML 映射、查询及部署说明。
  summary_en: Based on Bgee gene expression data, with a database dump, an ontology, OBDA and R2RML mappings, queries and deployment instructions.
  note: 按目录分别授权：数据 CC0，文字 CC BY 4.0，代码 Apache-2.0。部分命令已过时。
  note_en: 'Licensed per directory: data CC0, text CC BY 4.0, code Apache-2.0. Some commands are outdated.'

- id: suedtirol-open-data
  category: tutorials
  title: Südtirol Open Data OBDA
  url: https://github.com/dinglinfang/suedTirolOpenDataOBDA
  summary: 基于天气与交通传感器数据，结合 PostgreSQL/PostGIS 与 Ontop，包含可视分析。
  summary_en: Combines weather and traffic sensor data with PostgreSQL/PostGIS and Ontop, including visual analytics.
  note: Apache-2.0。运行环境较旧，需自行适配。
  note_en: Apache-2.0. The runtime environment is dated and needs adapting.

- id: atkis
  category: tutorials
  title: ATKIS
  url: https://github.com/apano-on/atkis
  summary: 基于德国 DLM250 地形数据，流程为 PostGIS → Ontop/SPARQL → QGIS。
  summary_en: Based on the German DLM250 topographic data, following the pipeline PostGIS → Ontop/SPARQL → QGIS.
  note: 该项目为 fork，数据需另行获取；许可证与下载可用性待确认。
  note_en: The project is a fork and the data must be obtained separately; the license and download availability are unconfirmed.

- id: adventureworks
  category: tutorials
  title: AdventureWorks → schema.org
  url: https://github.com/ontopic-vkg/adventureworks-sqlserver
  summary: 将 SQL Server 业务数据映射至 schema.org，提供 R2RML 映射、查询，以及虚拟与物化两种部署示例。
  summary_en: Maps SQL Server business data to schema.org, with R2RML mappings, queries, and deployment examples for both virtual and materialized access.
  note: 包含历史 Suite 项目文件；使用前请核对依赖与许可证。
  note_en: Contains historical Suite project files; check dependencies and licenses before use.

- id: trino-iceberg
  category: tutorials
  title: Ontop + Trino + Iceberg
  url: https://github.com/ontopic-vkg/ontop-trino-iceberg-playground
  summary: 数据湖场景下的虚拟访问，组合 Trino、Iceberg、Nessie 与 MinIO。
  summary_en: Virtual access in a data lake setting, combining Trino, Iceberg, Nessie and MinIO.
  note: 研究性质的 playground（fork），不保证开箱即用。
  note_en: A research playground (fork); it is not guaranteed to work out of the box.

# ── 基准测试 ────────────────────────────────────────────────

- id: rodi
  category: benchmarks
  title: RODI
  url: https://github.com/chrpin/rodi
  summary: 评测关系数据库到本体映射的自动及半自动生成质量。
  summary_en: Evaluates the quality of automatically and semi-automatically generated mappings from relational databases to ontologies.
  note: 评测对象为映射质量，而非查询延迟。复现时需固定场景与版本。
  note_en: It evaluates mapping quality, not query latency. Fix the scenarios and versions when reproducing results.
  links:
    - label: 项目主页
      label_en: Project page
      url: https://www.cs.ox.ac.uk/isg/tools/RODI/

- id: npd-benchmark
  category: benchmarks
  title: NPD Benchmark
  url: https://github.com/ontop/npd-benchmark
  summary: OBDA 查询与扩展性评测，提供关系数据、本体、映射与 SPARQL 查询。
  summary_en: An OBDA benchmark for query answering and scalability, providing relational data, an ontology, mappings and SPARQL queries.
  note: 数据为 NPD 历史快照，并非实时能源数据服务。
  note_en: The data is a historical NPD snapshot, not a live energy data service.

- id: vig
  category: benchmarks
  title: VIG
  url: https://github.com/ontop/vig
  summary: 数据生成器，依据源数据库与缩放因子生成更大规模的关系数据，用于 OBDA 评测。
  summary_en: A data generator that scales up a source database by a given factor to produce larger relational data sets for OBDA evaluation.
  note: 仅负责生成数据，不是查询引擎，本身也不构成完整的评测方案。
  note_en: It only generates data; it is not a query engine and does not constitute a complete benchmark on its own.

- id: bsbm
  category: benchmarks
  title: BSBM
  url: https://sourceforge.net/projects/bsbmtools/
  summary: Berlin SPARQL Benchmark。基于电商场景，比较 RDF 存储与关系数据库封装层的 SPARQL 查询性能。
  summary_en: The Berlin SPARQL Benchmark. Based on an e-commerce scenario, it compares SPARQL query performance across RDF stores and relational database wrappers.
  note: 经典基准，不专门评测本体推理。
  note_en: A classic benchmark that does not specifically evaluate ontology reasoning.

- id: watdiv
  category: benchmarks
  title: WatDiv
  url: https://dsg.uwaterloo.ca/watdiv/index.shtml
  summary: 评测不同查询结构与数据分布下的 RDF/SPARQL 性能。
  summary_en: Evaluates RDF/SPARQL performance across different query shapes and data distributions.
  note: 通用 RDF 基准。用于 VKG 评测时，需说明关系模式、映射设计与适配方式。
  note_en: A general-purpose RDF benchmark. When used for VKG evaluation, the relational schema, mapping design and adaptations need to be documented.
  links:
    - label: 源码
      label_en: Source code
      url: https://github.com/dsg-uwaterloo/watdiv

