      url: https://www.ijcai.org/proceedings/2025/0525.pdf

- id: geoqa-portal
  category: papers
  title: GeoQA Portal
  url: https://github.com/nitpicker55555/Geo-QA-Paper
  summary: 结合 LLM 的地理问答研究。
  summary_en: Research on geographic question answering with LLMs.
  note: 系统架构包含 PostGIS、Neo4j 与 ChromaDB，并非基于 Ontop 的纯虚拟访问，仅供参考。
  note_en: The architecture combines PostGIS, Neo4j and ChromaDB rather than pure virtual access based on Ontop; listed for reference only.

# ── 相关生态 ────────────────────────────────────────────────

- id: rml
  category: adjacent
  title: RML
  url: https://rml.io/specs/rml/
  summary: 将 R2RML 的映射方法扩展至 CSV、JSON、XML 等异构数据格式。
  summary_en: Extends the R2RML mapping approach to heterogeneous formats such as CSV, JSON and XML.
  note: 所链接的规范页标注为 Unofficial Draft，并非 W3C 推荐标准。
  note_en: The linked specification is marked as an Unofficial Draft and is not a W3C Recommendation.

- id: yarrrml
  category: adjacent
  title: YARRRML
  url: https://rml.io/yarrrml/
  summary: 基于 YAML 的映射语法，便于人工读写，可转换为 RML。
  summary_en: A YAML-based mapping syntax that is easy to read and write by hand and can be converted to RML.

- id: matey
  category: adjacent
  title: Matey
  url: https://rml.io/yarrrml/matey/
  summary: 基于浏览器的 YARRRML 编辑器，可在线编辑映射并查看生成的 RDF。
  summary_en: A browser-based YARRRML editor for editing mappings online and inspecting the generated RDF.
