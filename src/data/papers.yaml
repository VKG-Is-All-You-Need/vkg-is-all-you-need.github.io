# ── 讲义与综述 ──────────────────────────────────────────────

- id: xiao-intro-lecture
  topic: intro
  title: Introduction to Virtual Knowledge Graphs
  authors: G. Xiao
  year: 2024
  venue: Lecture, University of Bergen
  url: https://blog.homura.work/papers/vkg/Xiao%20-%20Introduction%20to%20Virtual%20Knowledge%20Graphs.pdf
  summary: VKG 入门讲义，介绍虚拟知识图谱的基本概念、组成部分与典型应用。
  summary_en: Introductory lecture on the basic concepts, components and typical applications of virtual knowledge graphs.

- id: xiao-query-lecture
  topic: intro
  title: Virtual Knowledge Graphs Query Processing
  authors: G. Xiao
  year: 2024
  venue: Lecture, University of Bergen
  url: https://blog.homura.work/papers/vkg/Xiao%20-%20Virtual%20Knowledge%20Graphs%20Query%20Processing.pdf
  summary: 入门讲义的第二部分，讲解 SPARQL 查询在 VKG 系统中的改写、展开与优化。
  summary_en: The second lecture, on how SPARQL queries are rewritten, unfolded and optimized in a VKG system.

- id: caise-tutorial
  topic: intro
  title: Designing Virtual Knowledge Graphs
  authors: D. Calvanese, D. Lanti
  year: 2024
  venue: CAiSE Tutorial
  url: https://blog.homura.work/papers/vkg/tutorial-design-vkg.pdf
  summary: CAiSE 2024 教程，讲解 VKG 的设计流程：本体建模、映射编写与映射模式。
  summary_en: 'CAiSE 2024 tutorial on designing VKGs: ontology modeling, writing mappings and mapping patterns.'

- id: vkg-overview
  topic: intro
  title: 'Virtual Knowledge Graphs: An Overview of Systems and Use Cases'
  authors: G. Xiao, L. Ding, B. Cogrel, D. Calvanese
  year: 2019
  venue: Data Intelligence
  url: https://doi.org/10.1162/dint_a_00011
  summary: VKG 综述，涵盖基本概念、代表性系统与应用案例。
  summary_en: A survey of VKG covering the core concepts, representative systems and use cases.

- id: obda-survey
  topic: intro
  title: 'Ontology-Based Data Access: A Survey'
  authors: G. Xiao, D. Calvanese, R. Kontchakov, D. Lembo, A. Poggi, R. Rosati, et al.
  year: 2018
  venue: IJCAI
  url: https://www.ijcai.org/proceedings/2018/777
  summary: OBDA 综述，涵盖整体框架、查询回答、映射管理与开放研究问题。
  summary_en: A survey of OBDA covering the overall framework, query answering, mapping management and open research problems.

# ── 理论基础 ────────────────────────────────────────────────

- id: data-integration
  topic: foundations
  title: 'Data Integration: A Theoretical Perspective'
  authors: M. Lenzerini
  year: 2002
  venue: PODS
  url: https://doi.org/10.1145/543613.543644
  summary: 数据集成的理论综述：由全局模式、数据源与映射构成的集成系统，以及 GAV、LAV 映射下的查询处理，是 OBDA 映射的理论来源。
  summary_en: 'A theoretical survey of data integration: integration systems made of a global schema, sources and mappings, and query processing under GAV and LAV mappings; the theoretical origin of OBDA mappings.'

- id: dl-lite
  topic: foundations
  title: 'Tractable Reasoning and Efficient Query Answering in Description Logics: The DL-Lite Family'
  authors: D. Calvanese, G. De Giacomo, D. Lembo, M. Lenzerini, R. Rosati
  year: 2007
  venue: Journal of Automated Reasoning
  url: https://doi.org/10.1007/s10817-007-9078-x
  summary: 提出 DL-Lite 描述逻辑家族，其查询回答可以改写为一阶查询，是 OWL 2 QL 的理论基础。
  summary_en: Introduces the DL-Lite family of description logics, whose query answering can be rewritten into first-order queries; the theoretical basis of OWL 2 QL.

- id: linking-data
  topic: foundations
  title: Linking Data to Ontologies
  authors: A. Poggi, D. Lembo, D. Calvanese, G. De Giacomo, M. Lenzerini, R. Rosati
  year: 2008
  venue: Journal on Data Semantics
  url: https://doi.org/10.1007/978-3-540-77688-8_5
  summary: OBDA 的奠基性论文，用映射把关系数据库与 DL-Lite 本体连接起来，并给出查询回答的方法。
  summary_en: A foundational OBDA paper that links relational databases to DL-Lite ontologies through mappings and gives a method for query answering.

- id: dl-lite-relations
  topic: foundations
  title: The DL-Lite Family and Relations
  authors: A. Artale, D. Calvanese, R. Kontchakov, M. Zakharyaschev
  year: 2009
  venue: Journal of Artificial Intelligence Research
  url: https://doi.org/10.1613/jair.2820
  summary: 系统梳理 DL-Lite 家族及相关逻辑的表达能力与推理复杂度。
  summary_en: A systematic account of the expressive power and reasoning complexity of the DL-Lite family and related logics.

- id: obdm
  topic: foundations
  title: Ontology-Based Data Management
  authors: M. Lenzerini
  year: 2011
  venue: CIKM
  url: https://doi.org/10.1145/2063576.2063582
  summary: 提出基于本体的数据管理（OBDM）：以本体作为企业数据的统一概念视图，通过映射连接各个数据源。
  summary_en: Introduces ontology-based data management (OBDM), in which an ontology is the unified conceptual view of enterprise data and is connected to the sources through mappings.

- id: t-mappings
  topic: foundations
  title: High Performance Query Answering over DL-Lite Ontologies
  authors: M. Rodríguez-Muro, D. Calvanese
  year: 2012
  venue: KR
  url: https://cdn.aaai.org/ocs/4547/4547-21819-1-PB.pdf
  summary: 提出 T-mappings，把本体公理编译进映射，使改写后的查询保持紧凑；Ontop 的查询优化以此为基础。
  summary_en: Introduces T-mappings, which compile ontology axioms into the mappings so that rewritten queries stay compact; the basis of query optimization in Ontop.

- id: perfectmap
  topic: foundations
  title: Optimizing Query Rewriting in Ontology-Based Data Access
  authors: F. Di Pinto, D. Lembo, M. Lenzerini, R. Mancini, A. Poggi, R. Rosati, et al.
  year: 2013
  venue: EDBT
  url: https://doi.org/10.1145/2452376.2452441
  summary: 在 Mastro 中利用映射视图之间的包含关系优化查询的改写与展开。
  summary_en: Optimizes query rewriting and unfolding in Mastro by exploiting containment between mapping views.

- id: sparql-owl2ql
  topic: foundations
  title: Answering SPARQL Queries over Databases under OWL 2 QL Entailment Regime
  authors: R. Kontchakov, M. Rezk, M. Rodríguez-Muro, G. Xiao, M. Zakharyaschev
  year: 2014
  venue: ISWC
  url: https://doi.org/10.1007/978-3-319-11964-9_35
  summary: 给出 OWL 2 QL 蕴涵语义下 SPARQL 查询到 SQL 的转换方法，Ontop 的查询改写以此为基础。
  summary_en: Gives a translation of SPARQL queries under the OWL 2 QL entailment regime into SQL, the basis of query rewriting in Ontop.

- id: rewriting-or-materialization
  topic: foundations
  title: 'OBDA: Query Rewriting or Materialization? In Practice, Both!'
  authors: J. F. Sequeda, M. Arenas, D. P. Miranker
  year: 2014
  venue: ISWC
  url: https://doi.org/10.1007/978-3-319-11964-9_34
  summary: 结合查询改写与物化：在关系数据库中以 SQL 视图实现本体推理，交由数据库优化器执行。
  summary_en: Combines query rewriting and materialization by implementing ontology reasoning as SQL views inside the relational database, leaving execution to its optimizer.

- id: cross-linked
  topic: foundations
  title: Ontology-Based Integration of Cross-Linked Datasets
  authors: D. Calvanese, M. Giese, D. Hovland, M. Rezk
  year: 2015
  venue: ISWC
  url: https://doi.org/10.1007/978-3-319-25007-6_12
  summary: 把数据源中的关联表经映射暴露为 owl:sameAs，在保持 SPARQL 可改写为 SQL 的前提下集成相互关联的数据集。
  summary_en: Exposes linking tables in the sources as owl:sameAs through mappings, integrating cross-linked datasets while keeping SPARQL rewritable into SQL.

- id: canonical-iris
  topic: foundations
  title: Efficient Ontology-Based Data Integration with Canonical IRIs
  authors: G. Xiao, D. Hovland, D. Bilidas, M. Rezk, M. Giese, D. Calvanese
  year: 2018
  venue: ESWC
  url: https://doi.org/10.1007/978-3-319-93417-4_45
  summary: 用规范 IRI 表示跨数据源的同一实体，避免 owl:sameAs 带来的答案膨胀。
  summary_en: Represents the same entity across sources with canonical IRIs, avoiding the blow-up of answers caused by owl:sameAs.

- id: obdm-abstraction
  topic: foundations
  title: The Notion of Abstraction in Ontology-Based Data Management
  authors: G. Cima, A. Poggi, M. Lenzerini
  year: 2023
  venue: Artificial Intelligence
  url: https://doi.org/10.1016/j.artint.2023.103976
  summary: 研究 OBDM 中的抽象：给定数据源上的查询，求本体上最能刻画它的查询，用于在概念层解释数据服务。
  summary_en: 'Studies abstraction in OBDM: given a query over the sources, find the ontology query that best characterizes it, to explain data services at the conceptual level.'

# ── 系统与平台 ──────────────────────────────────────────────

- id: mastro
  topic: systems
  title: The MASTRO System for Ontology-Based Data Access
  authors: D. Calvanese, G. De Giacomo, D. Lembo, M. Lenzerini, A. Poggi, M. Rodriguez-Muro, et al.
  year: 2011
  venue: Semantic Web
  url: https://doi.org/10.3233/SW-2011-0029
  summary: Mastro 的系统论文：基于 DL-Lite 的 OBDA 系统，采用查询改写、展开与求值的经典流程。
  summary_en: The system paper on Mastro, a DL-Lite-based OBDA system that follows the classical pipeline of query rewriting, unfolding and evaluation.

- id: ontop-of-databases
  topic: systems
  title: 'Ontology-Based Data Access: Ontop of Databases'
  authors: M. Rodríguez-Muro, R. Kontchakov, M. Zakharyaschev
  year: 2013
  venue: ISWC
  url: https://doi.org/10.1007/978-3-642-41335-3_35
  summary: Ontop 的早期系统论文，结合 T-mappings 与语义查询优化，在关系数据库上高效回答查询。
  summary_en: An early system paper on Ontop, combining T-mappings with semantic query optimization to answer queries efficiently over relational databases.

- id: ultrawrap
  topic: systems
  title: 'Ultrawrap: SPARQL Execution on Relational Data'
  authors: J. F. Sequeda, D. P. Miranker
  year: 2013
  venue: Journal of Web Semantics
  url: https://doi.org/10.1016/j.websem.2013.08.002
  summary: 以 SQL 视图定义三元组，把 SPARQL 转换为 SQL，交由关系数据库的优化器执行。
  summary_en: Defines triples as SQL views and translates SPARQL into SQL, relying on the optimizer of the relational database.

- id: optique
  topic: systems
  title: 'Optique: Zooming in on Big Data'
  authors: M. Giese, A. Soylu, G. Vega-Gorgojo, A. Waaler, P. Haase, E. Jiménez-Ruiz, et al.
  year: 2015
  venue: IEEE Computer
  url: https://doi.org/10.1109/MC.2015.82
  summary: Optique 平台的总体介绍：面向工业大数据的端到端 OBDA 平台，涵盖映射引导、查询构建与流数据处理。
  summary_en: An overview of the Optique platform, an end-to-end OBDA platform for industrial big data covering mapping bootstrapping, query formulation and stream processing.

- id: ontop-spatial
  topic: systems
  title: Ontop of Geospatial Databases
  authors: K. Bereta, M. Koubarakis
  year: 2016
  venue: ISWC
  url: https://doi.org/10.1007/978-3-319-46523-4_3
  code: https://github.com/ConstantB/ontop-spatial
  summary: Ontop-spatial：为 Ontop 加入 GeoSPARQL 支持，把空间查询改写为空间数据库上的 SQL。
  summary_en: Ontop-spatial adds GeoSPARQL support to Ontop, rewriting spatial queries into SQL over spatial databases.

- id: obda-mongodb
  topic: systems
  title: 'OBDA Beyond Relational DBs: A Study for MongoDB'
  authors: E. Botoeva, D. Calvanese, B. Cogrel, M. Rezk, G. Xiao
  year: 2016
  venue: DL Workshop
  url: https://ceur-ws.org/Vol-1577/paper_40.pdf
  summary: 把 OBDA 扩展到 MongoDB 文档数据库，研究 SPARQL 到 MongoDB 查询的转换。
  summary_en: Extends OBDA to the MongoDB document database and studies the translation of SPARQL into MongoDB queries.

- id: ontop-swj
  topic: systems
  title: 'Ontop: Answering SPARQL Queries over Relational Databases'
  authors: D. Calvanese, B. Cogrel, S. Komla-Ebri, R. Kontchakov, D. Lanti, M. Rezk, et al.
  year: 2017
  venue: Semantic Web
  url: https://doi.org/10.3233/SW-160217
  summary: Ontop 的系统论文，介绍其架构、查询改写与 SQL 优化。
  summary_en: The system paper on Ontop, covering its architecture, query rewriting and SQL optimization.

- id: beyond-relational
  topic: systems
  title: Ontology-Based Data Access – Beyond Relational Sources
  authors: E. Botoeva, D. Calvanese, B. Cogrel, J. Corman, G. Xiao
  year: 2019
  venue: Intelligenza Artificiale
  url: https://doi.org/10.3233/IA-190023
  summary: 总结 OBDA 向文档数据库等非关系数据源的扩展。
  summary_en: Summarizes the extension of OBDA to non-relational sources such as document databases.

- id: squerall
  topic: systems
  title: 'Squerall: Virtual Ontology-Based Access to Heterogeneous and Large Data Sources'
  authors: M. N. Mami, D. Graux, S. Scerri, H. Jabeen, S. Auer, J. Lehmann
  year: 2019
  venue: ISWC
  url: https://doi.org/10.1007/978-3-030-30796-7_15
  summary: 语义数据湖上的虚拟 OBDA，查询异构的大规模数据源。
  summary_en: Virtual OBDA over a semantic data lake, querying heterogeneous large-scale sources.

- id: ontop-iswc
  topic: systems
  title: The Virtual Knowledge Graph System Ontop
  authors: G. Xiao, D. Lanti, R. Kontchakov, S. Komla-Ebri, E. Güzel-Kalaycı, L. Ding, et al.
  year: 2020
  venue: ISWC
  url: https://doi.org/10.1007/978-3-030-62466-8_17
  summary: 介绍 Ontop 作为 VKG 系统的整体设计、查询转换流程、标准支持与应用情况。
  summary_en: Describes the overall design of Ontop as a VKG system, its query transformation pipeline, standards support and adoption.

- id: morph-csv
  topic: systems
  title: Enhancing Virtual Ontology Based Access over Tabular Data with Morph-CSV
  authors: D. Chaves-Fraga, E. Ruckhaus, F. Priyatna, M.-E. Vidal, O. Corcho
  year: 2021
  venue: Semantic Web
  url: https://doi.org/10.3233/SW-210432
  code: https://github.com/oeg-upm/morph-csv
  summary: 用 CSVW 与 RML 声明表格数据的隐式约束，提高 CSV 上虚拟访问的效率与答案完整性。
  summary_en: Declares implicit constraints of tabular data with CSVW and RML, improving the efficiency and completeness of virtual access over CSV.

- id: chimera
  topic: systems
  title: 'Chimera: A Bridge Between Big Data Analytics and Semantic Technologies'
  authors: M. Belcao, E. Falzone, E. Bionda, E. Della Valle
  year: 2021
  venue: ISWC
  url: https://doi.org/10.1007/978-3-030-88361-4_27
  code: https://github.com/chimera-suite/OntopSpark
  summary: 结合 Ontop 与 Spark 的数据湖分析平台（OntopSpark），并以 OntopStream 在 Flink 上处理流数据。
  summary_en: A data lake analytics platform combining Ontop with Spark (OntopSpark), with OntopStream handling streams on Flink.

- id: obdf
  topic: systems
  title: Ontology-based Data Federation
  authors: Z. Gu, D. Lanti, A. Mosca, G. Xiao, J. Xiong, D. Calvanese
  year: 2022
  venue: IJCKG
  url: https://doi.org/10.1145/3579051.3579070
  summary: 在 OBDA 之下加入联邦层，跨多个数据源回答查询，并利用离线计算的跨源提示优化执行。
  summary_en: Adds a federation layer below OBDA to answer queries across several sources, using cross-source hints computed offline to optimize execution.

- id: obdf-kbs
  topic: systems
  title: Ontology-Based Data Federation and Query Optimization
  authors: Z. Gu, D. Lanti, F. Corcoglioniti, M. Di Panfilo, A. Mosca, D. Calvanese, et al.
  year: 2025
  venue: Knowledge-Based Systems
  url: https://doi.org/10.1016/j.knosys.2025.114216
  summary: OBDF 的期刊扩展版，系统阐述联邦场景下的查询优化。
  summary_en: The journal extension of OBDF, presenting query optimization in the federated setting.

- id: vkg-eo
  topic: systems
  title: Virtual Knowledge Graphs over Earth Observation Data
  authors: A. Pano, D. Lanti, D. Calvanese
  year: 2025
  venue: ISWC
  url: https://doi.org/10.1007/978-3-032-09530-5_9
  code: https://github.com/apano-on/ontopEO
  summary: ontopEO：把 openEO 地球观测数据立方体作为虚拟知识图谱查询。
  summary_en: ontopEO queries openEO Earth observation datacubes as a virtual knowledge graph.

# ── 构建与映射 ──────────────────────────────────────────────

- id: semantic-mappings
  topic: construction
  title: Inferring Complex Semantic Mappings Between Relational Tables and Ontologies from Simple Correspondences
  authors: Y. An, A. Borgida, J. Mylopoulos
  year: 2005
  venue: ODBASE
  url: https://doi.org/10.1007/11575801_15
  summary: 从列与本体属性之间的简单对应关系推导出复杂的映射公式。
  summary_en: Infers complex mapping formulas from simple correspondences between columns and ontology attributes.

- id: ontology-extraction
  topic: construction
  title: Automatic Extraction of Ontologies Wrapping Relational Data Sources
  authors: L. Lubyte, S. Tessaris
  year: 2009
  venue: DEXA
  url: https://doi.org/10.1007/978-3-642-03573-9_10
  summary: 从关系模式中同时抽取本体及其映射。
  summary_en: Extracts an ontology together with its mappings from a relational schema.

- id: bootox
  topic: construction
  title: 'BootOX: Practical Mapping of RDBs to OWL 2'
  authors: E. Jiménez-Ruiz, E. Kharlamov, D. Zheleznyakov, I. Horrocks, C. Pinkel, M. G. Skjæveland, et al.
  year: 2015
  venue: ISWC
  url: https://doi.org/10.1007/978-3-319-25010-6_7
  summary: Optique 中的映射引导工具，从关系数据库生成 OWL 2 本体与映射，并支持与已有本体对齐。
  summary_en: The bootstrapping tool of Optique, which generates OWL 2 ontologies and mappings from relational databases and aligns them with existing ontologies.

- id: mapping-analysis
  topic: construction
  title: 'Mapping Analysis in Ontology-Based Data Access: Algorithms and Complexity'
  authors: D. Lembo, J. Mora, R. Rosati, D. F. Savo, E. Thorstensen
  year: 2015
  venue: ISWC
  url: https://doi.org/10.1007/978-3-319-25007-6_13
  summary: 检测映射中不一致与冗余的断言，并给出相应的算法与复杂度结果。
  summary_en: Detects inconsistent and redundant mapping assertions, with algorithms and complexity results.

- id: rodi
  topic: construction
  title: 'RODI: Benchmarking Relational-to-Ontology Mapping Generation Quality'
  authors: C. Pinkel, C. Binnig, E. Jiménez-Ruiz, E. Kharlamov, W. May, et al.
  year: 2017
  venue: Semantic Web
  url: https://doi.org/10.3233/SW-170268
  code: https://github.com/chrpin/rodi
  summary: 评测关系数据库到本体映射的自动生成质量，覆盖学术会议、地理与油气勘探三个场景，比较了七个映射生成系统。
  summary_en: Evaluates the quality of automatically generated relational-to-ontology mappings in three scenarios (conferences, geography, oil and gas exploration), comparing seven mapping generation systems.

- id: axioms-through-mappings
  topic: construction
  title: Acquiring Ontology Axioms through Mappings to Data Sources
  authors: F. Di Pinto, G. De Giacomo, D. Lembo, M. Lenzerini, R. Rosati
  year: 2019
  venue: Future Internet
  url: https://doi.org/10.3390/fi11120260
  summary: 通过映射从数据中产生本体公理，借助高阶 DL-Lite 的元建模，同时保持查询可改写为 SQL。
  summary_en: Acquires ontology axioms from the data through mappings, using the meta-modeling of higher-order DL-Lite while keeping queries rewritable into SQL.

- id: mapping-patterns
  topic: construction
  title: Conceptually-Grounded Mapping Patterns for Virtual Knowledge Graphs
  authors: D. Calvanese, A. Gal, D. Lanti, M. Montali, A. Mosca, R. Shraga
  year: 2023
  venue: Data & Knowledge Engineering
  url: https://doi.org/10.1016/j.datak.2023.102157
  code: https://github.com/ontop/ontop-examples/tree/master/dke-2022-mapping-patterns
  summary: 以概念模型为依据整理 VKG 的映射模式，并给出形式化定义。
  summary_en: Catalogs mapping patterns for VKGs grounded in conceptual models and defines them formally.

- id: llm4vkg
  topic: construction
  title: 'LLM4VKG: Leveraging Large Language Models for Virtual Knowledge Graph Construction'
  authors: G. Xiao, L. Ren, G. Qi, H. Xue, M. Di Panfilo, D. Lanti
  year: 2025
  venue: IJCAI
  url: https://www.ijcai.org/proceedings/2025/0525.pdf
  code: https://github.com/HomuraT/LLM4VKG
  summary: 利用大语言模型完成本体构建、模式分析与映射生成，处理命名歧义与匹配问题。
  summary_en: Uses large language models for ontology development, schema analysis and mapping generation, addressing naming ambiguity and matching.

- id: text2sql-kgqa
  topic: construction
  title: Bootstrapping Text-to-SQL Resources for Knowledge Graph Question Answering
  authors: C. Kosten, D. Lanti, P. Cudré-Mauroux, K. Stockinger
  year: 2025
  venue: IEEE SDS
  url: https://doi.org/10.1109/SDS66131.2025.00009
  summary: 扩展 Ontop 的 bootstrap 功能生成 R2RML 映射，把已有的 Text-to-SQL 资源转换为知识图谱问答基准，并应用于 ScienceBenchmark。
  summary_en: Extends the Ontop bootstrapper to generate R2RML mappings and turns existing Text-to-SQL resources into knowledge graph question answering benchmarks, applied to ScienceBenchmark.

- id: rigor
  topic: construction
  title: Retrieval-Augmented Generation of Ontologies from Relational Databases
  authors: N. Fathallah, M. Nayyeri, A. A. Yogi, R. B. Thapa, H.-M. Tautenhahn, A. Schnurpel, et al.
  year: 2025
  venue: arXiv
