  summary_en: The Optique platform gives Siemens unified access to streaming and static data; its components include BootOX, STARQL, ExaStream and OptiqueVQS.

- id: sdrl
  topic: applications
  title: 'Semantically-Enhanced Rule-Based Diagnostics for Industrial Internet of Things: The SDRL Language and Case Study for Siemens Trains and Turbines'
