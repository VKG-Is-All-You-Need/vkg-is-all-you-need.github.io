  summary_en: 'The OBDA deployment at Statoil: semi-automatic ontology and mapping generation, query optimization and a visual query interface for engineers.'

- id: siemens
  topic: applications
  title: Semantic Access to Streaming and Static Data at Siemens
  authors: E. Kharlamov, T. Mailis, G. Mehdi, C. Neuenstadt, Ö. Özçep, M. Roshchin, et al.
