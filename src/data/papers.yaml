  summary_en: Unifies scattered data on food production and trade in the Roman Empire under a single conceptual view for historians.

- id: statoil
  topic: applications
  title: Ontology Based Data Access in Statoil
  authors: E. Kharlamov, D. Hovland, M. G. Skjæveland, D. Bilidas, E. Jiménez-Ruiz, G. Xiao, et al.
