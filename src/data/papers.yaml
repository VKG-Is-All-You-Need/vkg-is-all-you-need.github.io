  year: 2017
  venue: IJCAI
  url: https://doi.org/10.24963/ijcai.2017/161
  summary: 本体或源模式变化后，按最小改变原则修复映射。
  summary_en: Repairs the mappings under the principle of minimal change after the ontology or the source schema changes.

- id: write-also-obda
